<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Monthly To-Do Calendar</title>
<style>
:root{--ink:#4b352c;--line:#e7d9cd;--paper:#fffaf3;--rose:#a66c5c;--green:#49bd6a}*{box-sizing:border-box}body{margin:0;background:#f6eee7;color:var(--ink);font-family:"Avenir Next",Avenir,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:100%;max-width:1700px;margin:auto;padding:18px 18px 24px}.header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:77px}.month{font-family:Georgia,serif;font-weight:400;font-size:clamp(32px,4.4vw,62px);color:#94614e;margin:0;text-align:center}.nav{border:0;background:transparent;color:#674639;padding:12px 10px;font-size:clamp(12px,1.3vw,17px);cursor:pointer}.nav.next{justify-self:end}.nav.prev{justify-self:start}.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week{background:#f1e0d4;border:1px solid var(--line);border-bottom:0}.week>div{text-align:center;padding:11px 1px;font-size:clamp(9px,1.05vw,13px);font-weight:650;letter-spacing:.08em}.grid{border-left:1px solid var(--line);border-top:1px solid var(--line);background:var(--paper)}.day{position:relative;min-width:0;height:clamp(160px,20vh,225px);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 7px 7px;display:flex;flex-direction:column;background:linear-gradient(125deg,#fffaf5,#fdf7ef)}.day.weekend{background:#f2f7f9}.day.today{background:#f9e8e4}.day.blank{background:#fcf7f0}.date{font-size:clamp(14px,1.55vw,21px);font-weight:600;margin-bottom:5px}.tasks{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;overscroll-behavior:contain}.task{display:flex;align-items:flex-start;gap:4px;min-height:24px;margin-bottom:2px}.check{flex:0 0 15px;width:15px;height:15px;border:1.5px solid #bea99c;border-radius:4px;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;color:white;font-weight:800;margin-top:3px}.check.done{background:var(--green);border-color:var(--green)}.task textarea{flex:1;min-width:0;width:100%;resize:none;overflow:hidden;font:normal clamp(10px,.9vw,12px)/1.25 "Avenir Next",system-ui,sans-serif;color:#4b3b32;background:transparent;border:0;border-bottom:1px solid #e5d8cc;border-radius:0;padding:2px 1px;outline:none;min-height:21px;overflow-wrap:anywhere}.task textarea:focus{border-bottom-color:#a66c5c}.remove{border:0;background:none;color:#c4aa9d;padding:1px;font-size:14px;cursor:pointer;opacity:.65;flex-shrink:0}.add{width:100%;border:0;border-radius:8px;background:#f4e7dd;color:#9b6958;font-size:11px;padding:6px 3px;margin-top:4px;cursor:pointer;flex-shrink:0}.day.weekend .add{background:#e9edf0}.pencil{border:0;background:none;color:#a16e5e;font-size:14px;cursor:pointer;position:absolute;top:7px;right:7px}.foot{text-align:center;color:#a58c80;font-size:12px;margin-top:10px}.modal{position:fixed;inset:0;background:#30221bb3;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}.modal.show{display:flex}.panel{background:#fffaf3;border-radius:18px;width:min(850px,96vw);padding:16px;box-shadow:0 12px 45px #0004}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.panelhead h2{margin:4px 0 12px;font:italic 27px Georgia,serif;color:#94614e}.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.tools button,.close{background:#f2e5dc;border:0;border-radius:9px;padding:9px 13px;color:#66483d;cursor:pointer}.tools button.active{background:#a66c5c;color:white}canvas{width:100%;height:340px;background:repeating-linear-gradient(to bottom,#fffdf9 0px,#fffdf9 33px,#e7d9cd 34px,#fffdf9 35px);border:1px solid #e7d9cd;border-radius:9px;touch-action:none;display:block}.ghost{display:flex;align-items:center;gap:5px;min-height:23px;cursor:pointer}.ghostbox{width:15px;height:15px;border:1px solid #c9b8ad;border-radius:3px;flex-shrink:0}.ghostline{height:1px;background:#e7d9cd;flex:1}@media(max-width:700px){.app{padding:8px 6px}.header{min-height:64px}.month{font-size:29px}.day{padding:5px 3px;height:165px}.task{gap:2px}.check{flex-basis:12px;width:12px;height:12px;border-radius:3px}.task textarea{font-size:9px;line-height:1.2}.remove{font-size:12px}.add{font-size:10px}.week>div{font-size:8px;letter-spacing:0}.pencil{font-size:11px}.ghost{min-height:21px}.ghostbox{width:12px;height:12px}}
</style></head><body><main class="app"><header class="header"><button class="nav prev" id="prev">‹ <span id="prevLabel">September</span></button><h1 class="month" id="monthTitle"></h1><button class="nav next" id="next"><span id="nextLabel">November</span> ›</button></header><div class="week"><div>MONDAY</div><div>TUESDAY</div><div>WEDNESDAY</div><div>THURSDAY</div><div>FRIDAY</div><div>SATURDAY</div><div>SUNDAY</div></div><section class="grid" id="grid"></section><p class="foot">Tap + Add task for more lines · Tap a box to mark it green · ✎ for handwritten notes</p></main><div class="modal" id="modal"><div class="panel"><div class="panelhead"><h2 id="noteTitle">Handwritten Notes</h2><button class="close" id="close">Done</button></div><div class="tools"><button id="pen" class="active">✎ Pen</button><button id="eraser">Eraser</button><button id="clear">Clear</button></div><canvas id="canvas"></canvas></div></div>
<script>
const key='monthly-todo-exact-v1',months=['January','February','March','April','May','June','July','August','September','October','November','December'];let y=2026,m=9;let state={};try{state=JSON.parse(localStorage.getItem(key))||{}}catch(e){}const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}};const id=(day)=>`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;function tasksFor(k){if(!state[k])state[k]={tasks:[],drawing:''};return state[k]}
function render(){document.getElementById('monthTitle').textContent=months[m]+' '+y;document.getElementById('prevLabel').textContent=months[(m+11)%12];document.getElementById('nextLabel').textContent=months[(m+1)%12];const grid=document.getElementById('grid');grid.replaceChildren();const start=(new Date(y,m,1).getDay()+6)%7;const count=new Date(y,m+1,0).getDate();const rows=Math.ceil((start+count)/7);for(let i=0;i<rows*7;i++){const d=i-start+1;const cell=document.createElement('div');cell.className='day'+(i%7>4?' weekend':'');if(d<1||d>count){cell.classList.add('blank');grid.append(cell);continue}const k=id(d);if(new Date().getFullYear()===y&&new Date().getMonth()===m&&new Date().getDate()===d)cell.classList.add('today');const num=document.createElement('div');num.className='date';num.textContent=d;cell.append(num);const pencil=document.createElement('button');pencil.className='pencil';pencil.textContent='✎';pencil.title='Handwritten notes';pencil.onclick=()=>openDrawing(k,d);cell.append(pencil);const list=document.createElement('div');list.className='tasks';cell.append(list);
function paintTasks(focusIndex=-1){list.replaceChildren();tasksFor(k).tasks.forEach((t,j)=>{const row=document.createElement('div');row.className='task';const check=document.createElement('button');check.className='check'+(t.done?' done':'');check.textContent=t.done?'✓':'';check.setAttribute('aria-label','Toggle complete');check.onclick=()=>{t.done=!t.done;save();check.classList.toggle('done',t.done);check.textContent=t.done?'✓':''};const input=document.createElement('textarea');input.rows=1;input.value=t.text||'';input.placeholder='';input.setAttribute('aria-label','Task');const resize=()=>{input.style.height='auto';input.style.height=Math.max(21,input.scrollHeight)+'px'};input.addEventListener('input',()=>{t.text=input.value;resize();save()});const remove=document.createElement('button');remove.className='remove';remove.textContent='×';remove.setAttribute('aria-label','Remove task');remove.onclick=()=>{tasksFor(k).tasks.splice(j,1);save();paintTasks()};row.append(check,input,remove);list.append(row);resize();if(j===focusIndex){input.focus();list.scrollTop=list.scrollHeight}});const missing=Math.max(0,5-tasksFor(k).tasks.length);for(let z=0;z<missing;z++){const ghost=document.createElement('div');ghost.className='ghost';const ghostbox=document.createElement('span');ghostbox.className='ghostbox';const ghostline=document.createElement('span');ghostline.className='ghostline';ghost.append(ghostbox,ghostline);ghost.onclick=()=>add.click();list.append(ghost)}}
const add=document.createElement('button');add.className='add';add.textContent='+ Add task';add.onclick=()=>{const arr=tasksFor(k).tasks;arr.push({text:'',done:false});save();paintTasks(arr.length-1)};cell.append(add);paintTasks();grid.append(cell)}}document.getElementById('prev').onclick=()=>{m--;if(m<0){m=11;y--}render()};document.getElementById('next').onclick=()=>{m++;if(m>11){m=0;y++}render()};render();
const modal=document.getElementById('modal'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let activeKey=null,draw=false,erase=false,last=null;function openDrawing(k,d){activeKey=k;document.getElementById('noteTitle').textContent=`${d} ${months[m]} — Handwritten Notes`;modal.classList.add('show');canvas.width=1200;canvas.height=500;ctx.clearRect(0,0,canvas.width,canvas.height);const data=tasksFor(k).drawing;if(data){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,canvas.width,canvas.height);im.src=data}}function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);draw=true;last=pos(e)});canvas.addEventListener('pointermove',e=>{if(!draw)return;e.preventDefault();const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=erase?24:3;ctx.strokeStyle=erase?'#fffdf9':'#405c92';ctx.stroke();last=p});function end(){if(draw){draw=false;tasksFor(activeKey).drawing=canvas.toDataURL('image/png');save()}}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);document.getElementById('pen').onclick=()=>{erase=false;document.getElementById('pen').classList.add('active');document.getElementById('eraser').classList.remove('active')};document.getElementById('eraser').onclick=()=>{erase=true;document.getElementById('eraser').classList.add('active');document.getElementById('pen').classList.remove('active')};document.getElementById('clear').onclick=()=>{if(confirm('Clear handwritten notes for this day?')){ctx.clearRect(0,0,canvas.width,canvas.height);tasksFor(activeKey).drawing='';save()}};document.getElementById('close').onclick=()=>{end();modal.classList.remove('show')};modal.onclick=e=>{if(e.target===modal)document.getElementById('close').click()};
</script></body></html>
